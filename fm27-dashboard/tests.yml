# FM27 Dashboard – automatische Prüfung bei jedem Hochladen
# Läuft die komplette Testreihe (über 1.000 Prüfungen) in einem simulierten Browser.
# Ergebnis: grüner Haken ✓ oder rotes ✗ neben dem Commit bzw. unter „Actions“.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:      # auch von Hand startbar (Actions → Tests → Run workflow)

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund
      - name: Testreihe ausführen
        run: npm test
