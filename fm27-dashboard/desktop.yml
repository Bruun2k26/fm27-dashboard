# FM27 Dashboard – Desktop-App bauen (Windows + Linux) mit Tauri
# Start von Hand: Actions → „Desktop-App bauen“ → Run workflow.
# Ergebnis: unten im Lauf unter „Artifacts“ zum Herunterladen
#   Windows: Installer .exe (empfohlen) und .msi · Linux: .deb und .AppImage
name: Desktop-App bauen

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: ubuntu-22.04
            label: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Rust installieren
        uses: dtolnay/rust-toolchain@stable

      - name: Rust-Zwischenspeicher (schnellere Folgebuilds)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Linux-Systembibliotheken
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Abhängigkeiten installieren
        run: npm install --no-audit --no-fund

      - name: Desktop-App bauen
        run: npm run desktop:build

      - name: Installer bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: FM27-Dashboard-${{ matrix.label }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
